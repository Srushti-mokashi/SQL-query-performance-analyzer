<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Query Performance Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0px);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .result-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 4px solid #667eea;
            display: none;
        }

        .result-section.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }

        .result-content {
            background: white;
            padding: 15px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #333;
            overflow-x: auto;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }

        .error {
            color: #d32f2f;
            padding: 12px;
            background: #ffebee;
            border-radius: 4px;
            margin-top: 10px;
            border-left: 4px solid #d32f2f;
        }

        .success {
            color: #388e3c;
        }

        .message {
            text-align: center;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
        }

        .message.error {
            background: #ffebee;
            color: #d32f2f;
            border-left: 4px solid #d32f2f;
        }

        .message.success {
            background: #e8f5e9;
            color: #388e3c;
            border-left: 4px solid #388e3c;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 22px;
                margin-bottom: 20px;
            }

            textarea {
                min-height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SQL Query Performance Analyzer</h1>
        
        <form id="analyzerForm">
            <div class="form-group">
                <label for="queryInput">Enter SQL Query:</label>
                <textarea 
                    id="queryInput" 
                    placeholder="Example: SELECT * FROM users WHERE id = 1;" 
                    required
                ></textarea>
            </div>
            
            <button type="submit" id="analyzeBtn">Analyze Query</button>
        </form>

        <div id="messageContainer"></div>

        <div id="resultSection" class="result-section">
            <div class="result-title">
                <span id="resultStatus">Analysis Result:</span>
            </div>
            <div id="resultContent" class="result-content"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('analyzerForm');
        const queryInput = document.getElementById('queryInput');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const resultSection = document.getElementById('resultSection');
        const resultContent = document.getElementById('resultContent');
        const resultStatus = document.getElementById('resultStatus');
        const messageContainer = document.getElementById('messageContainer');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const query = queryInput.value.trim();

            if (!query) {
                showMessage('Please enter a SQL query', 'error');
                return;
            }

            analyzeBtn.disabled = true;
            resultContent.textContent = 'Loading...';
            resultContent.className = 'result-content loading';
            resultSection.classList.add('show');
            messageContainer.innerHTML = '';

            try {
                const response = await fetch('http://localhost:5000/api/analytics', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();

                resultStatus.textContent = 'Analysis Result:';
                resultStatus.className = 'success';
                resultContent.textContent = JSON.stringify(result, null, 2);
                resultContent.className = 'result-content';
                showMessage('Query analyzed successfully!', 'success');
            } catch (error) {
                let errorMessage = 'An error occurred while analyzing the query';

                if (error.message.includes('Failed to fetch')) {
                    errorMessage = 'Cannot connect to backend. Make sure the server is running on http://localhost:5000';
                } else if (error.message.includes('HTTP error')) {
                    errorMessage = `Server error: ${error.message}`;
                } else {
                    errorMessage = error.message;
                }

                resultStatus.textContent = 'Error:';
                resultStatus.className = 'error';
                resultContent.textContent = errorMessage;
                resultContent.className = 'result-content error';
                showMessage(errorMessage, 'error');
            } finally {
                analyzeBtn.disabled = false;
            }
        });

        function showMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = message;
            messageContainer.innerHTML = '';
            messageContainer.appendChild(messageDiv);

            if (type === 'success') {
                setTimeout(() => {
                    messageDiv.remove();
                }, 4000);
            }
        }
    </script>
</body>
</html>
