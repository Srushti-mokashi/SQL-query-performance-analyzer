version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: sql_analyzer_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sql_analyzer
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
